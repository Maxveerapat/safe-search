name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the app
        run: gradle -p android assembleDebug --stacktrace

      - name: Publish the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SearchSafetyShield.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest SearchSafetyShield.apk \
            --title "Search Safety Shield · Android prototype · build ${{ github.run_number }}" \
            --notes "Test build. Install on Android, then turn on Accessibility access in the app." \
            --prerelease
