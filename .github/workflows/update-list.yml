name: Update safety list

on:
  schedule:
    - cron: "0 23 * * *"        # every day 06:00 Bangkok time
  push:
    branches: [main]
    paths: ["admin/**", "src/**", "build/**", "config/**"]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the list
        run: python admin/build_list.py --base-url "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the bookmark + setup page
        env:
          SSF_MANIFEST_URL: ${{ steps.pages.outputs.base_url }}/list/manifest.json
        run: |
          npm ci
          node build/build.mjs config/production.json site
          cp site/setup.html site/index.html
          rm -f site/setup-artifact.html

      - name: Save first-seen dates
        run: |
          git config user.name "list-bot"
          git config user.email "list-bot@users.noreply.github.com"
          git add state/first_seen.tsv
          git diff --cached --quiet || git commit -m "First-seen dates $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
